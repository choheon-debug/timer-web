<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>타이머</title>
<meta name="description" content="붉은 다이얼로 남은 시간을 보여 주는 타이머">
<meta name="theme-color" content="#F7F6F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="타이머">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="monoton.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Monoton";font-display:swap;src:url(monoton.woff2) format("woff2")}
/* 옅은 회색 바탕에 주황 부채꼴. 시계 숫자는 여러 줄 테두리 글꼴(Monoton)에 구리빛 주황 */
:root{
  --bg:#f7f6f9; --surface:#fff; --ink:#2a2326; --muted:#8a7f84; --line:#ebe6ea;
  --accent:#e08a2c; --accent-soft:rgb(224 138 44 / .32); --accent-tint:#fdf0dd;
  --copper:linear-gradient(180deg,#f8c67e 0%,#eba046 45%,#c9772c 100%); --off:#d8d2d6;
  --shadow:0 2px 10px rgb(0 0 0 / .07);
  --digital:"Monoton",ui-monospace,"SF Mono",monospace;
  --body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.digital{font-family:var(--digital);font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.02em;background:var(--copper);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}

.app{height:100%;display:flex;flex-direction:column;justify-content:center;gap:4px;max-width:900px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.now{text-align:center}
.now small{display:block;font-size:.8rem;color:var(--muted)}
.now .digital{font-size:clamp(2.6rem,15vw,4.6rem)}
.dial{flex:none;display:flex;align-items:center;justify-content:center}
/* 다이얼은 화면에 맞춰 최대한 크게, 위아래 시계와 바로 붙게 */
.dial svg{width:min(100%,calc(100dvh - 330px),720px);min-width:220px;aspect-ratio:1;height:auto;display:block;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.remain{text-align:center}
.remain small{display:block;font-size:.8rem;color:var(--muted)}
.remain .digital{font-size:clamp(2.3rem,13vw,4.2rem)}
.remain.paused .digital{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{opacity:.35}}
.ctrl{display:grid;grid-template-columns:60px 1fr 60px;gap:14px;align-items:center;margin-top:14px;width:100%;max-width:520px;align-self:center}
.round{width:60px;height:60px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:1.4rem;color:var(--accent)}
.round svg{width:26px;height:26px}
.go{height:60px;border:0;border-radius:99px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:1.15rem;box-shadow:0 6px 16px rgb(224 138 44 / .35)}

/* 설정(새 창) */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet header{background:var(--accent);color:#fff;border-radius:0 0 22px 22px;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.sheet header h2{margin:0;font-size:1.25rem}
.back{border:0;background:none;color:#fff;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.back svg{width:24px;height:24px}
.sheet .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px))}
.sheet .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.group{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.group h3{margin:0;font-size:.85rem;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.group h3 i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.72rem}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:10px}
.stepper button{height:52px;border:0;border-radius:14px;background:var(--accent-tint);color:var(--accent);font-weight:700;font-size:1.5rem}
.stepper output{text-align:center;font-size:1.7rem;font-weight:700}
.stepper output small{font-size:.9rem;font-weight:400;color:var(--muted);margin-left:2px}
.hm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.field .hm input{width:4.6em;flex:none;border:0;border-radius:12px;background:var(--bg);padding:10px;font-size:1.15rem;text-align:center}
.hm span{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.78rem;color:var(--muted)}
.field input{border:0;border-radius:12px;background:var(--bg);padding:11px 12px;font-size:1.05rem;width:100%;min-width:0}
.btn{border:0;border-radius:99px;padding:11px 16px;font-weight:700;background:var(--accent);color:#fff;white-space:nowrap;flex:none}
.btn.light{background:var(--accent-tint);color:var(--accent)}
.row{display:flex;gap:8px;align-items:flex-end}
.row .field{flex:1;min-width:0}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:1rem}
.toggle span b{color:var(--accent);margin-right:4px}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--off);transition:background .2s;pointer-events:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgb(0 0 0 / .2)}
.sw input:checked + i{background:var(--accent)}
.sw input:checked + i::after{transform:translateX(22px)}
.sw input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:.8rem;color:var(--muted);line-height:1.5;margin:0}
.note{font-size:.8rem;color:var(--accent);margin:0}

/* 끝났을 때 */
.done{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#f0a33a,#cf721d);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(24px,env(safe-area-inset-left,0px))}
.done .bell{font-size:4rem;animation:ring 1s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.done .bell,.remain.paused .digital{animation:none}}
.done .digital{font-size:3.6rem;background:none;color:#fff}
.done .say{background:rgb(255 255 255 / .16);border-radius:18px;padding:14px 18px;font-size:1.15rem;line-height:1.5;max-width:420px;overflow-wrap:anywhere}
.done .say small{display:block;font-size:.75rem;opacity:.85}
.done .ok{border:0;background:#fff;color:#b55f15;border-radius:99px;padding:16px 56px;font-weight:700;font-size:1.15rem}
.done .again{border:0;background:none;color:#fff;font-size:.95rem;text-decoration:underline;opacity:.9}
.next{display:block;font-size:.85rem;color:var(--muted);margin-top:2px;min-height:1.2em}
.dim{opacity:.45;pointer-events:none}
.seq{display:flex;flex-direction:column;gap:10px}
.step{border-radius:14px;background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.step-top{display:flex;align-items:center;gap:8px}
.step-no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.mini{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.mini button{flex:none;width:36px;height:40px;border:0;border-radius:12px;background:var(--accent-tint);color:var(--accent);font-weight:700;font-size:1.2rem}
.field .mini input,.mini input{width:2.9em;flex:none;border:0;border-radius:10px;background:var(--surface);padding:8px 6px;font-size:1.1rem;text-align:center}
.mini span{color:var(--muted);font-size:.85rem;white-space:nowrap}
.end{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);white-space:nowrap}
.end label{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.end input{border:0;border-radius:10px;background:var(--surface);padding:7px 10px;font-size:1rem;min-width:7.4em;flex:1 0 auto;max-width:11em}
.end small{font-size:.74rem;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.del{flex:none;border:0;background:none;color:var(--muted);font-size:1.1rem;width:40px;height:40px;border-radius:50%}
.step input.say{border:0;border-radius:10px;background:var(--surface);padding:9px 11px;font-size:.98rem;width:100%;min-width:0}
.total{font-size:.85rem;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-size:.92rem;z-index:60;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<main class="app">
  <div class="now"><small id="nowDate"></small><span class="digital" id="nowClock">0:00</span></div>
  <div class="dial"><svg id="dial" viewBox="-172 -172 344 344" role="slider" aria-label="타이머 시간 (분)" aria-valuemin="0" aria-valuemax="60" tabindex="0"></svg></div>
  <div class="remain" id="remainBox"><small id="remainLabel">남은 시간</small><span class="digital" id="remain">25:00</span><span class="next" id="nextInfo"></span></div>
  <div class="ctrl">
    <button class="round" id="btnReset" aria-label="처음으로"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></button>
    <button class="go" id="btnGo">▶ 시작</button>
    <button class="round" id="btnSettings" aria-label="설정"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></button>
  </div>
</main>

<div class="done" id="done" hidden role="alertdialog" aria-label="시간이 다 됐어요">
  <span class="bell" aria-hidden="true">⏰</span>
  <span class="digital">00:00</span>
  <div class="say"><small>🔊 읽어 주는 말</small><span id="doneText"></span></div>
  <button class="ok" id="btnOk">확인</button>
  <button class="again" id="btnAgain">처음부터 다시 시작</button>
</div>

<script>
"use strict";
/* ---------- 상태 (휴대폰에 저장: 껐다 켜도 이어서) ---------- */
const KEY = "timer.v1", MAX_MIN = 720, DEFAULT_SAY = "시간이 다 됐어요";
const fresh = () => ({ setMin: 25, status: "idle", endAt: 0, leftMs: 25 * 60000, say: "", notify: false, awake: true,
  seqOn: false, seq: [{ min: 25, say: "" }, { min: 5, say: "" }], seqIdx: 0, repeat: false });
let st = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) st = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
if (!Array.isArray(st.seq) || !st.seq.length) st.seq = fresh().seq;
if (st.seqIdx >= st.seq.length) st.seqIdx = 0;
/* 연속 타이머: 켜져 있으면 목록(seq)의 타이머를 차례로 실행한다 */
const useSeq = () => st.seqOn && st.seq.length > 0;
const curMin = () => useSeq() ? st.seq[st.seqIdx].min : st.setMin;
const stepSay = i => st.seq[i].say.trim() || `${i + 1}번째 타이머가 끝났어요`;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const leftNow = () => st.status === "running" ? Math.max(0, st.endAt - Date.now()) : st.leftMs;
function fmt(ms) {
  const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${pad(m)}:${pad(x)}` : `${pad(m)}:${pad(x)}`;
}
const minText = m => m >= 60 ? `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ""}` : `${m}분`;
function toast(t) {
  document.querySelector(".toast")?.remove();
  const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2600);
}

/* ---------- 다이얼 (0~60분, 12시에서 시계 방향으로 남은 만큼 붉게) ---------- */
const svg = $("#dial"), NS = "http://www.w3.org/2000/svg", R = 120;
const pol = (deg, r) => [r * Math.sin(deg * Math.PI / 180), -r * Math.cos(deg * Math.PI / 180)];
function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
for (let m = 0; m < 60; m++) {
  const major = m % 5 === 0, a = m * 6, [x1, y1] = pol(a, major ? 122 : 127), [x2, y2] = pol(a, 138);
  el("line", { x1, y1, x2, y2, stroke: major ? "var(--accent)" : "var(--accent-soft)", "stroke-width": major ? 3.6 : 2.2, "stroke-linecap": "round" });
  if (major) { const [tx, ty] = pol(a, 156); el("text", { x: tx, y: ty + 6, "text-anchor": "middle", "font-size": 17, "font-weight": 700, fill: "var(--accent)", "font-family": "var(--body)" }).textContent = m; }
}
const wedge = el("path", { fill: "var(--accent)" });
const knob = el("circle", { r: 11, fill: "#fff", stroke: "#9a9296", "stroke-width": 1.5 });
function drawDial(ms) {
  const min = ms / 60000, a = Math.min(min, 60) / 60 * 360;
  if (a >= 359.99) wedge.setAttribute("d", `M0,${-R}A${R},${R} 0 1 1 -0.01,${-R}Z`);
  else if (a <= 0) wedge.setAttribute("d", "");
  else { const [x, y] = pol(a, R); wedge.setAttribute("d", `M0,0L0,${-R}A${R},${R} 0 ${a > 180 ? 1 : 0} 1 ${x},${y}Z`); }
  const [kx, ky] = pol(a, R); knob.setAttribute("cx", kx); knob.setAttribute("cy", ky);
  svg.setAttribute("aria-valuenow", Math.round(Math.min(min, 60)));
}

/* ---------- 화면 그리기 ---------- */
function render() {
  const ms = leftNow();
  drawDial(ms);
  $("#remain").textContent = fmt(ms);
  const what = st.status === "paused" ? "일시정지" : st.status === "running" ? "남은 시간" : `설정 시간 · ${minText(curMin())}`;
  $("#remainLabel").textContent = useSeq() ? `${st.seqIdx + 1}/${st.seq.length}번째 타이머 · ${what}` : what;
  const nx = st.seqIdx + 1 < st.seq.length ? st.seqIdx + 1 : st.repeat ? 0 : -1;
  $("#nextInfo").textContent = !useSeq() ? "" : nx < 0 ? "마지막 타이머예요" : `다음: ${nx + 1}번째 ${minText(st.seq[nx].min)}${nx === 0 ? " (처음부터 반복)" : ""}`;
  $("#remainBox").classList.toggle("paused", st.status === "paused");
  $("#btnGo").textContent = st.status === "running" ? "❚❚ 일시정지" : st.status === "paused" ? "▶ 계속" : "▶ 시작";
}
function clock() {
  const n = new Date();
  $("#nowClock").textContent = `${n.getHours() % 12 || 12}:${pad(n.getMinutes())}`;   // 잠금화면처럼 6:22
  $("#nowDate").textContent = `${n.getMonth() + 1}월 ${n.getDate()}일 ${"일월화수목금토"[n.getDay()]}요일 · ${n.getHours() < 12 ? "오전" : "오후"}`;
}
let raf = 0;
function loop() {
  if (st.status === "running" && Date.now() >= st.endAt) { advance(); if (st.status !== "running") return; }
  render(); raf = requestAnimationFrame(loop);
}
setInterval(() => { clock(); if (st.status === "running" && Date.now() >= st.endAt) advance(); }, 500);
/** 시간이 다 된 타이머를 처리한다. 연속 타이머면 다음 타이머를 바로 이어서 시작하고, 마지막이면 끝낸다.
    앱이 꺼져 있던 사이 여러 개가 지났으면 그만큼 건너뛴다. */
function advance() {
  if (st.status !== "running" || Date.now() < st.endAt) return;
  if (!useSeq()) { finish(stepless()); return; }
  let ended = -1;
  while (Date.now() >= st.endAt) {
    const last = st.seqIdx >= st.seq.length - 1;
    ended = st.seqIdx;
    if (last && !st.repeat) { finish(stepSay(ended)); return; }
    st.seqIdx = last ? 0 : st.seqIdx + 1;
    st.endAt += st.seq[st.seqIdx].min * 60000;
  }
  save(); stepAlarm(stepSay(ended)); render();
}
const stepless = () => st.say.trim() || DEFAULT_SAY;

/* ---------- 시작 · 일시정지 · 처음으로 ---------- */
let audio = null;
function unlockSound() {   // 휴대폰은 버튼을 누를 때 한 번 소리·음성을 깨워 둬야 나중에 울릴 수 있다
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  try { if ("speechSynthesis" in window && !unlockSound.done) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); unlockSound.done = true; } } catch (e) {}
}
function start() {
  unlockSound();
  if (st.leftMs <= 0) st.leftMs = curMin() * 60000;
  st.endAt = Date.now() + st.leftMs; st.status = "running"; save();
  keepAwake(); cancelAnimationFrame(raf); loop();
}
function pause() {
  st.leftMs = leftNow(); st.status = "paused"; save();
  cancelAnimationFrame(raf); releaseAwake(); render();
}
function reset() {
  st.status = "idle"; st.seqIdx = 0; st.leftMs = curMin() * 60000; save();
  cancelAnimationFrame(raf); releaseAwake(); render();
}
/** 설정 시간을 바꾼다. 타이머가 가는 중이면 새 시간으로 계속 간다. */
function setMinutes(min) {
  const m = Math.max(1, Math.min(MAX_MIN, Math.round(min)));
  if (useSeq()) st.seq[st.seqIdx].min = m; else st.setMin = m;   // 연속 타이머면 지금 차례의 타이머를 바꾼다
  st.leftMs = m * 60000;
  if (st.status === "running") st.endAt = Date.now() + st.leftMs;
  else if (st.status === "paused") st.status = "idle";
  save(); render();
}
$("#btnGo").onclick = () => st.status === "running" ? pause() : start();
$("#btnReset").onclick = reset;

/* 다이얼을 끌어서 1분 단위로 정하기 */
let dragging = false;
function fromPointer(e) {
  const r = svg.getBoundingClientRect(), x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
  let deg = Math.atan2(x, -y) * 180 / Math.PI; if (deg < 0) deg += 360;
  let m = Math.round(deg / 6);
  if (m === 0) m = dragging === "high" ? 60 : 1;   // 12시 근처: 위에서 끌어오면 60분, 아니면 1분
  dragging = m >= 45 ? "high" : true;
  setMinutes(m);
}
svg.addEventListener("pointerdown", e => { dragging = true; svg.setPointerCapture(e.pointerId); fromPointer(e); });
svg.addEventListener("pointermove", e => { if (dragging) fromPointer(e); });
svg.addEventListener("pointerup", () => { dragging = false; });
svg.addEventListener("pointercancel", () => { dragging = false; });
svg.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" || e.key === "ArrowRight") { setMinutes(curMin() + 1); e.preventDefault(); }
  if (e.key === "ArrowDown" || e.key === "ArrowLeft") { setMinutes(curMin() - 1); e.preventDefault(); }
});

/* ---------- 5. 화면 켜짐 유지 ---------- */
let lock = null;
async function keepAwake() {
  if (!st.awake || st.status !== "running" || !("wakeLock" in navigator) || lock) return;
  try { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } catch (e) {}
}
function releaseAwake() { try { lock?.release(); } catch (e) {} lock = null; }
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (st.status === "running" && Date.now() >= st.endAt) advance();
  if (st.status === "running") keepAwake();
  render();
});

/* ---------- 끝났을 때: 알람 소리 · 진동 · 음성 · 알림 ---------- */
let alarmTimer = 0, alarmStop = 0;
function beep() {
  if (!audio) return;
  try {
    const t = audio.currentTime;
    for (let i = 0; i < 3; i++) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t + i * 0.22); g.gain.exponentialRampToValueAtTime(0.5, t + i * 0.22 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.22 + 0.16);
      o.connect(g).connect(audio.destination); o.start(t + i * 0.22); o.stop(t + i * 0.22 + 0.18);
    }
  } catch (e) {}
}
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "ko-KR"; u.rate = 1;
    const ko = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("ko")); if (ko) u.voice = ko;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function finish(text) {
  cancelAnimationFrame(raf);
  st.status = "idle"; st.leftMs = 0; st.seqIdx = 0; save();
  releaseAwake(); render();
  $("#doneText").textContent = text;
  $("#done").hidden = false; $("#btnOk").focus();
  try { audio?.resume(); } catch (e) {}
  let n = 0;
  const ring = () => {
    beep(); navigator.vibrate?.([300, 150, 300]);
    if (n % 4 === 1) speak(text);   // 소리 사이사이 음성을 몇 번 읽어 준다
    n++;
  };
  ring(); alarmTimer = setInterval(ring, 1500);
  alarmStop = setTimeout(stopAlarm, 60000);   // 1분 동안 울리고 멈춘다
  notifyNow("⏰ 타이머 끝", text, true);
}
function notifyNow(title, body, sticky) {
  if (!st.notify || !("Notification" in window) || Notification.permission !== "granted") return;
  navigator.serviceWorker?.ready.then(r => r.showNotification(title, {
    body, tag: "timer-done", renotify: true, requireInteraction: sticky, vibrate: [300, 150, 300, 150, 300], icon: "icons/icon-192.png",
  })).catch(() => {});
}
/** 연속 타이머 중간: 짧게 울리고 말해 준 뒤 다음 타이머가 바로 이어진다 */
function stepAlarm(text) {
  try { audio?.resume(); } catch (e) {}
  beep(); setTimeout(beep, 900);
  navigator.vibrate?.([300, 150, 300]);
  setTimeout(() => speak(text), 1600);
  const next = `${st.seqIdx + 1}번째 ${minText(st.seq[st.seqIdx].min)} 시작`;
  toast(`${text} · ${next}`);
  notifyNow("⏱️ 다음 타이머 시작", `${text} · ${next}`, false);
}
function stopAlarm() {
  clearInterval(alarmTimer); clearTimeout(alarmStop);
  try { speechSynthesis.cancel(); } catch (e) {}
  navigator.vibrate?.(0);
  navigator.serviceWorker?.ready.then(r => r.getNotifications({ tag: "timer-done" })).then(ns => ns?.forEach(n => n.close())).catch(() => {});
}
$("#btnOk").onclick = () => { stopAlarm(); $("#done").hidden = true; st.seqIdx = 0; st.leftMs = curMin() * 60000; save(); render(); };
$("#btnAgain").onclick = () => { stopAlarm(); $("#done").hidden = true; st.seqIdx = 0; st.leftMs = curMin() * 60000; start(); };

/* ---------- 설정 (새 창, 휴대폰 뒤로가기로도 닫힘) ---------- */
const BACK_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>';

  document.body.appendChild(s);

  const q = sel => s.querySelector(sel);
  q(".back").onclick = () => history.back();
  const show = () => {
    q("#sMin").innerHTML = st.setMin >= 60 ? `${Math.floor(st.setMin / 60)}<small>시간</small> ${st.setMin % 60}<small>분</small>` : `${st.setMin}<small>분</small>`;

  q("#sPlus").onclick = () => { setMinutes(st.setMin + 1); show(); };

    q("#sSeq").innerHTML = st.seq.map((x, i) => `

const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

/* ---------- 시작 ---------- */
clock();
